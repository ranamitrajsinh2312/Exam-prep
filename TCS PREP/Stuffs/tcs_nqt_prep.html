<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCS NQT — Countdown to Aug 22</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel2:#22262f; --line:#2c313c;
    --amber:#e8a33d; --amber-dim:#8a6a30; --teal:#4fd1c5; --red:#e8635d;
    --text:#e9e7e1; --sub:#9aa0ab; --mono:'JetBrains Mono','Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); padding-bottom:60px;}
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 40px;}

  /* Board header */
  .board{background:linear-gradient(180deg,#1a1d24,#15171c); border:1px solid var(--line); border-radius:10px; padding:20px 18px; margin-bottom:18px; position:relative; overflow:hidden;}
  .board::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--amber),transparent 70%);}
  .board-eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.15em; color:var(--amber); text-transform:uppercase;}
  .board-dest{font-size:22px; font-weight:700; margin-top:4px; letter-spacing:.01em;}
  .flap-row{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .flap{background:#0e1014; border:1px solid var(--line); border-radius:6px; padding:10px 6px; flex:1; min-width:64px; text-align:center;}
  .flap-num{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--amber); line-height:1;}
  .flap-lbl{font-size:9px; color:var(--sub); text-transform:uppercase; letter-spacing:.1em; margin-top:4px;}
  .board-foot{margin-top:14px; font-size:12px; color:var(--sub); font-family:var(--mono);}

  /* Tabs */
  .tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .tab{flex:1; text-align:center; padding:11px 4px; font-size:13px; font-weight:600; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; transition:.15s;}
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .view{display:none;} .view.active{display:block;}

  /* Roadmap */
  .progress-bar{height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-bottom:16px; border:1px solid var(--line);}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--amber-dim),var(--amber)); width:0%; transition:width .3s;}
  .progress-txt{font-size:12px; color:var(--sub); margin-bottom:18px; font-family:var(--mono);}
  .day-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; transition:.15s;}
  .day-card:hover{border-color:var(--amber-dim);}
  .day-card.done{opacity:.5;}
  .day-check{width:20px; height:20px; border-radius:5px; border:2px solid var(--sub); flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--bg); transition:.15s;}
  .day-card.done .day-check{background:var(--amber); border-color:var(--amber);}
  .day-body{flex:1;}
  .day-head{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
  .day-title{font-size:13.5px; font-weight:700;}
  .day-date{font-size:11px; color:var(--sub); font-family:var(--mono); white-space:nowrap;}
  .day-topics{font-size:12.5px; color:var(--sub); margin-top:3px; line-height:1.5;}
  .day-card.done .day-title{text-decoration:line-through;}
  .week-lbl{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.1em; text-transform:uppercase; margin:20px 0 8px; padding-top:4px;}
  .week-lbl:first-child{margin-top:0;}

  /* Practice */
  .sec-pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .sec-chip{background:var(--panel); border:1px solid var(--line); padding:7px 12px; border-radius:20px; font-size:12px; cursor:pointer; color:var(--sub); font-weight:600;}
  .sec-chip.active{background:var(--amber); color:#1a1400; border-color:var(--amber);}
  .topic-item{background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden;}
  .topic-head{padding:13px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .topic-name{font-size:13.5px; font-weight:700;}
  .topic-meta{font-size:11px; color:var(--sub); font-family:var(--mono); margin-top:2px;}
  .topic-arrow{color:var(--sub); font-size:12px; transition:.2s;}
  .topic-item.open .topic-arrow{transform:rotate(90deg);}
  .topic-body{display:none; padding:0 14px 16px; border-top:1px solid var(--line);}
  .topic-item.open .topic-body{display:block;}
  .q-block{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}
  .q-block:first-child{border-top:none; margin-top:14px; padding-top:0;}
  .q-text{font-size:13.5px; line-height:1.5; margin-bottom:9px;}
  .q-num{color:var(--amber); font-family:var(--mono); font-size:12px; margin-right:5px;}
  .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:9px 11px; border-radius:6px; font-size:12.5px; margin-bottom:6px; cursor:pointer; font-family:var(--sans);}
  .opt.correct{border-color:var(--teal); background:rgba(79,209,197,.12); color:var(--teal);}
  .opt.wrong{border-color:var(--red); background:rgba(232,99,93,.12); color:var(--red);}
  .opt:disabled{cursor:default;}
  .exp{font-size:12px; color:var(--sub); margin-top:6px; display:none; line-height:1.4;}
  .exp.show{display:block;}
  .topic-score{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--mono); font-size:13px; color:var(--amber); text-align:center; display:none;}
  .topic-score.show{display:block;}

  h2.sec-title{font-size:15px; margin:22px 0 4px; color:var(--amber);}
  .sec-sub{font-size:12px; color:var(--sub); margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="board">
    <div class="board-eyebrow">TCS NQT · Departure Board</div>
    <div class="board-dest">Exam Day — 22 Aug 2026</div>
    <div class="flap-row" id="countdown"></div>
    <div class="board-foot" id="boardfoot">loading…</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="roadmap">Roadmap</div>
    <div class="tab" data-view="practice">Practice · MCQs</div>
  </div>

  <div class="view active" id="view-roadmap">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="progress-txt" id="progTxt">0 / 21 days complete</div>
    <div id="roadmapList"></div>
  </div>

  <div class="view" id="view-practice">
    <div class="sec-pick" id="secPick"></div>
    <div id="topicList"></div>
  </div>

</div>

<script>
/* ===================== ROADMAP DATA ===================== */
const ROADMAP = [
 {week:"Week 1 — Foundation Core", days:[
  {d:"Day 1", date:"Aug 3", t:"Diagnostic mock", topics:"One full-length mock, no prep — establish baseline, log weak sections"},
  {d:"Day 2", date:"Aug 4", t:"Percentages + Profit & Loss", topics:"Highest-weightage combo — drill until fast"},
  {d:"Day 3", date:"Aug 5", t:"Time, Speed & Distance", topics:"+ Boats & Streams"},
  {d:"Day 4", date:"Aug 6", t:"Time & Work", topics:"+ Pipes & Cisterns"},
  {d:"Day 5", date:"Aug 7", t:"Ratio & Proportion + SI/CI", topics:"Simple & Compound Interest basics"},
  {d:"Day 6", date:"Aug 8", t:"Blood Relations + Coding-Decoding + Series", topics:"Start daily 30-min coding practice from today onward"},
 ]},

  {d:"Day 9", date:"Aug 11", t:"Ages + P&C + Probability", topics:""},

  {d:"Day 11", date:"Aug 13", t:"Data Interpretation + Mensuration", topics:""},

 ]},

  {d:"Day 15", date:"Aug 17", t:"Advanced Coding — arrays/strings/patterns", topics:"Timed practice"},
  {d:"Day 16", date:"Aug 18", t:"Advanced Coding — recursion, sorting/searching", topics:"Timed practice"},
  {d:"Day 17", date:"Aug 19", t:"Pseudo-code / output-prediction", topics:""},
  {d:"Day 18", date:"Aug 20", t:"Advanced Quant + Advanced Reasoning", topics:"Harder versions of Foundation topics"},
  {d:"Day 19", date:"Aug 21 AM", t:"Full-length mock #2", topics:"All sections, timed — review every mistake"},
  {d:"Day 20", date:"Aug 21 PM", t:"Full-length mock #3 + revise formula sheet", topics:"Low-frequency topics as quick recall only"},
 ]},
 {week:"Exam Day", days:[
  {d:"Day 21", date:"Aug 22", t:"No new topics", topics:"Skim formula sheet, revise error log, stay calm"},
 ]},
];

/* ===================== QUESTION BANK ===================== */
const SECTIONS = {
 "Numerical Ability": ["Percentages","Profit & Loss","Time, Speed & Distance","Time & Work","Ratio & Proportion","Simple & Compound Interest","Number System","Averages","Problems on Ages","Permutation, Combination & Probability","Data Interpretation","Mensuration","Progressions","Mixtures & Allegations","Simplification & Approximation","Miscellaneous (Partnership, Clocks, Geometry, Sets)"],
 "Reasoning Ability": ["Blood Relations","Coding-Decoding","Number & Letter Series","Direction Sense","Syllogism","Seating Arrangement","Puzzles","Statement & Conclusion","Data Sufficiency","Analogy & Classification","Venn Diagrams & Cubes/Dice"],
 "Verbal Ability": ["Sentence Completion","Passage Recall","Professional Email Writing"],
 "Advanced Section": ["Advanced Coding (DSA)","Pseudo-code & Output Prediction","Advanced Quant","Advanced Reasoning"]
};

const Q = {};

Q["Percentages"]=[
{q:"40% of 250 = ?",o:["90","100","110","120"],a:1,e:"0.4 × 250 = 100"},
{q:"If 20% of x = 50, x = ?",o:["200","225","250","275"],a:2,e:"x = 50 / 0.2 = 250"},
{q:"A number increased by 25% becomes 100. Find the original number.",o:["75","80","85","90"],a:1,e:"100 / 1.25 = 80"},
{q:"Price is reduced 20% then increased 25%. Net change?",o:["5% increase","No change","5% decrease","10% increase"],a:1,e:"0.8 × 1.25 = 1 → no net change"},
{q:"15 is what percent of 60?",o:["20%","25%","30%","35%"],a:1,e:"15/60 = 0.25 = 25%"},
{q:"A's salary is 25% more than B's. B's salary is what % less than A's?",o:["15%","20%","25%","30%"],a:1,e:"B = A/1.25 → 20% less than A"},
{q:"65% of students passed an exam. If 210 failed, total students?",o:["550","600","650","700"],a:1,e:"35% = 210 → total = 600"},
{q:"A number is decreased by 10% then increased by 10%. Net effect?",o:["No change","1% decrease","1% increase","2% decrease"],a:1,e:"0.9 × 1.1 = 0.99 → 1% less"},
{q:"30% of 150 is what percent of 90?",o:["40%","45%","50%","55%"],a:2,e:"45 is 50% of 90"},
{q:"Population rose from 8000 to 8800. Percentage increase?",o:["8%","9%","10%","12%"],a:2,e:"800/8000 = 10%"}
];

Q["Profit & Loss"]=[
{q:"CP = 200, SP = 250. Profit %?",o:["20%","25%","30%","35%"],a:1,e:"Profit 50/200 = 25%"},
{q:"An article bought for 500 is sold at a loss of 10%. Find SP.",o:["440","450","460","470"],a:1,e:"500 × 0.9 = 450"},
{q:"Marked price ₹1000, discount 10%. Sold at ₹900, giving 20% profit on CP. Find CP.",o:["700","720","750","780"],a:2,e:"900 = 1.2 × CP → CP = 750"},
{q:"Selling an article for ₹720 causes a 10% loss. What SP gives a 10% gain?",o:["850","864","880","900"],a:2,e:"CP = 800; 10% gain SP = 880"},
{q:"CP of 20 articles = SP of 16 articles. Find gain %.",o:["20%","25%","30%","35%"],a:1,e:"SP = 1.25×CP per article → 25% gain"},
{q:"Goods marked 40% above cost, 10% discount given. Profit %?",o:["24%","26%","28%","30%"],a:1,e:"1.4 × 0.9 = 1.26 → 26%"},
{q:"Successive discounts of 20% and 10% equal a single discount of?",o:["26%","28%","30%","32%"],a:1,e:"1 − (0.8×0.9) = 0.28 → 28%"},
{q:"A man sells two items for ₹1200 each, one at 20% profit, other at 20% loss. Overall result?",o:["No loss no gain","4% loss","4% gain","5% loss"],a:1,e:"Same SP + equal %± always gives net loss = 4%"},
{q:"SP of an article is 1.5 times CP. Profit %?",o:["33.3%","50%","60%","66.6%"],a:1,e:"1.5 − 1 = 0.5 → 50%"},
{q:"A trader marks up 25% and gives 20% discount. Net result?",o:["5% profit","No profit no loss","5% loss","10% profit"],a:1,e:"1.25 × 0.8 = 1.0 exactly"}
];

Q["Time, Speed & Distance"]=[
{q:"Speed 60 km/h for 2.5 h. Distance covered?",o:["130 km","140 km","150 km","160 km"],a:2,e:"60 × 2.5 = 150 km"},
{q:"A car covers 300 km in 5 hours. Speed in m/s?",o:["15","16.67","18","20"],a:1,e:"60 km/h = 16.67 m/s"},
{q:"Trains of 100 m & 150 m run opposite at 30 & 20 km/h. Time to cross?",o:["15 s","18 s","20 s","22 s"],a:1,e:"250m ÷ 13.89 m/s ≈ 18 s"},
{q:"Rowing speed 10 km/h still water, current 2 km/h. Time to row 24 km downstream?",o:["1.5 h","2 h","2.5 h","3 h"],a:1,e:"24 ÷ 12 = 2 h"},
{q:"Boat speed downstream 15 km/h, upstream 9 km/h. Speed in still water?",o:["10","11","12","13"],a:2,e:"(15+9)/2 = 12 km/h"},
{q:"A distance is covered in 40 min at 60 km/h. Speed needed to cover it in 30 min?",o:["70","75","80","85"],a:2,e:"Distance = 40 km; 40÷0.5h = 80 km/h"},
{q:"Speed ratio of A and B is 3:4. Ratio of time to cover same distance?",o:["3:4","4:3","1:1","2:3"],a:1,e:"Time is inverse of speed → 4:3"},
{q:"A train 120 m long crosses a pole in 12 s. Speed in km/h?",o:["30","33","36","40"],a:2,e:"10 m/s = 36 km/h"},
{q:"Bus speed excl. stoppages 60 km/h, incl. stoppages 50 km/h. Stoppage per hour?",o:["8 min","10 min","12 min","15 min"],a:1,e:"10 km gap ÷ 60 km/h = 10 min"},
{q:"Walking at 5 km/h, a man is 6 min late; at 6 km/h, 2 min early. Distance to office?",o:["3 km","4 km","5 km","6 km"],a:1,e:"d/5 − d/6 = 8/60 → d = 4 km"}
];

Q["Time & Work"]=[
{q:"A does a job in 10 days, B in 15 days. Together?",o:["5 days","6 days","7 days","8 days"],a:1,e:"1/10+1/15 = 1/6 → 6 days"},
{q:"A is twice as good a workman as B; together they finish in 14 days. A alone?",o:["18 days","21 days","24 days","28 days"],a:1,e:"3x=1/14 → A alone = 21 days"},
{q:"A finishes a job in 20 days, B in 30. They work together 5 days, then B leaves. A finishes rest in?",o:["10 days","11.67 days","12 days","13 days"],a:1,e:"Remaining 7/12 work at A's rate = 11.67 days"},
{q:"Pipe A fills a tank in 6 h, pipe B empties it in 9 h. Both open — time to fill?",o:["15 h","18 h","20 h","24 h"],a:1,e:"1/6−1/9 = 1/18 → 18 h"},
{q:"12 men complete a job in 8 days. Men needed for 6 days?",o:["14","15","16","18"],a:2,e:"12×8÷6 = 16 men"},
{q:"A and B together do a job in 12 days; A alone in 20 days. B alone?",o:["25 days","28 days","30 days","32 days"],a:2,e:"1/12−1/20 = 1/30 → 30 days"},
{q:"A pipe fills a cistern in 12 h; with a leak it takes 16 h. Leak alone empties it in?",o:["40 h","44 h","48 h","52 h"],a:2,e:"1/12−1/16 = 1/48 → 48 h"},
{q:"3 men or 4 women finish a job in 20 days. Time for 6 men + 8 women together?",o:["4 days","5 days","6 days","7 days"],a:1,e:"Combined rate = 0.2/day → 5 days"},
{q:"A finishes a job in 18 days, B in 24. Working together, A leaves 4 days before completion. Total days?",o:["11 days","12.6 days","13 days","14 days"],a:1,e:"7T=88 → T ≈ 12.6 days"},
{q:"Taps fill a tank in 15 & 20 min together, but one is closed 5 min before filling. Total time?",o:["10 min","11.4 min","12 min","13 min"],a:1,e:"7T=80 → T ≈ 11.4 min"}
];

Q["Ratio & Proportion"]=[
{q:"Two numbers are in ratio 3:4, sum = 140. Find the larger.",o:["60","70","80","90"],a:2,e:"140×4/7 = 80"},
{q:"If a:b = 2:3 and b:c = 4:5, find a:b:c.",o:["6:9:10","8:12:15","4:6:8","2:3:5"],a:1,e:"Scale b to LCM(3,4)=12 → a:b:c = 8:12:15"},
{q:"Divide ₹900 among A, B, C in ratio 2:3:4. B's share?",o:["250","300","350","400"],a:1,e:"900×3/9 = 300"},
{q:"If x/y = 3/5, find (2x+3y)/(3x−y).",o:["5","5.25","5.5","6"],a:1,e:"x=3k,y=5k → 21k/4k = 5.25"},
{q:"Two numbers in ratio 5:7 sum to 168. Find the larger.",o:["88","91","98","105"],a:2,e:"168×7/12 = 98"},
{q:"Money split A:B:C = 1:2:3. C gets ₹300 more than A. Total sum?",o:["800","900","1000","1200"],a:1,e:"2 parts=300 → part=150 → total=900"},
{q:"Ages of A,B are 4:5. After 6 yrs ratio is 6:7. A's present age?",o:["10","12","14","16"],a:1,e:"Solve: 7(4x+6)=6(5x+6) → x=3 → A=12"},
{q:"5:x :: x:20. Find x (mean proportional).",o:["8","9","10","12"],a:2,e:"x² = 100 → x = 10"},
{q:"Numbers in ratio 4:7; each +6 gives ratio 5:8. Find the smaller.",o:["20","24","28","32"],a:1,e:"3x=18 → x=6 → smaller=24"},
{q:"Coins Re1, 50p, 25p in ratio 5:6:8 total ₹210. Number of 50p coins?",o:["120","126","132","140"],a:1,e:"10x=210 → x=21 → 50p coins=6×21=126"}
];

Q["Simple & Compound Interest"]=[
{q:"SI on ₹5000 at 8% for 3 years?",o:["1000","1100","1200","1300"],a:2,e:"5000×0.08×3=1200"},
{q:"Principal giving SI ₹900 in 3 yrs at 6%?",o:["4500","5000","5500","6000"],a:1,e:"P=900/(0.06×3)=5000"},
{q:"CI on ₹10000 at 10% for 2 years?",o:["2000","2100","2200","2500"],a:1,e:"10000×1.21−10000=2100"},
{q:"Rate at which ₹8000 amounts to ₹9800 in 3 yrs (SI)?",o:["6%","7%","7.5%","8%"],a:2,e:"SI=1800 → rate=1800/(8000×3)×100=7.5%"},
{q:"Difference between CI & SI on ₹5000 for 2 yrs at 10%?",o:["40","50","60","70"],a:1,e:"CI=1050, SI=1000 → diff=50"},
{q:"A sum doubles in 8 years at SI. Find the rate.",o:["10%","12.5%","15%","20%"],a:1,e:"100/8=12.5%"},
{q:"CI on ₹15000 for 3 yrs at 10% p.a. (approx)?",o:["4500","4800","4965","5100"],a:2,e:"15000×1.331−15000≈4965"},
{q:"A sum triples in 20 years at SI. Find the rate.",o:["8%","10%","12%","15%"],a:1,e:"200/20=10%"},
{q:"SI on a sum for 2 yrs at 5% is ₹500. Find the sum.",o:["4000","4500","5000","5500"],a:2,e:"P=500/(0.05×2)=5000"},
{q:"CI and SI on a sum for 2 yrs at 5% differ by ₹25. Find the sum.",o:["8000","9000","10000","12000"],a:2,e:"P×(0.05)²=25 → P=10000"}
];

Q["Number System"]=[
{q:"LCM of 12 and 18?",o:["24","30","36","42"],a:2,e:"36"},
{q:"HCF of 24 and 36?",o:["6","8","12","18"],a:2,e:"12"},
{q:"Remainder when 2^10 is divided by 7?",o:["1","2","3","4"],a:1,e:"1024 mod 7 = 2"},
{q:"Sum of the first 20 natural numbers?",o:["190","200","210","220"],a:2,e:"n(n+1)/2 = 210"},
{q:"A number leaves remainder 3 when divided by 5. Remainder when its square is divided by 5?",o:["1","2","3","4"],a:3,e:"3²=9 → 9 mod 5 = 4"},
{q:"Which of these is a prime number?",o:["91","97","111","119"],a:1,e:"97 has no factors besides 1 and itself"},
{q:"Smallest number which leaves remainder 1 when divided by 6, 9, and 12?",o:["35","36","37","38"],a:2,e:"LCM(6,9,12)=36 → +1 = 37"},
{q:"Numbers between 1–100 divisible by both 3 and 5?",o:["5","6","7","8"],a:1,e:"Divisible by 15: 15,30,45,60,75,90 → 6"},
{q:"Product of two numbers is 1050, HCF is 5. Find LCM.",o:["200","210","220","230"],a:1,e:"LCM = product/HCF = 210"},
{q:"Unit digit of 7^45?",o:["1","3","7","9"],a:2,e:"Cycle 7,9,3,1; 45 mod 4 = 1 → 7"}
];

Q["Averages"]=[
{q:"Average of 10, 20, 30, 40, 50?",o:["25","28","30","32"],a:2,e:"Sum150÷5=30"},
{q:"Avg age of 5 people is 30. One leaves, avg of 4 becomes 28. Age of person who left?",o:["34","36","38","40"],a:2,e:"150−112=38"},
{q:"Average of the first 10 odd numbers?",o:["9","10","11","12"],a:1,e:"Sum=100÷10=10"},
{q:"Batsman's avg after 12 innings is 40. Scoring 92 in the 13th raises avg by 4. New average?",o:["42","44","46","48"],a:1,e:"Old avg + 4 = 44"},
{q:"Avg weight of 8 persons rises by 2.5 kg when a 65 kg person is replaced. New person's weight?",o:["80","82","85","88"],a:2,e:"65+8×2.5=85"},
{q:"Average of 5 consecutive numbers is 20. Find the largest.",o:["21","22","23","24"],a:1,e:"18,19,20,21,22 → largest=22"},
{q:"Avg marks of 30 students is 60; avg of 18 of them is 55. Avg of remaining 12?",o:["65","66","67.5","68"],a:2,e:"(1800−990)/12=67.5"},

{q:"In a code, all vowels in a word are replaced by the next vowel in sequence (a→e→i→o→u→a). How is 'EAT' coded?",o:["IEU","IEV","AEU","IET"],a:3,e:"E→I, A→E, T (consonant) unchanged → IET"},
{q:"Six people sit in two rows of 3, facing each other. If A faces D, and B is to A's right, who faces B?",o:["The person to D's left","The person to D's right","A","C"],a:1,e:"Mirror positioning: person facing B is to D's right side (since rows face each other)"},
{q:"A cube has different colors on each face. If Red is opposite Blue, and Green is opposite Yellow, which pair are the remaining two faces?",o:["White and Black (opposite each other)","Red and Green","Blue and Yellow","None can be determined"],a:0,e:"With 3 opposite pairs, the remaining two faces must be opposite each other"},

{q:"A sequence puzzle: if Monday's code is 'CAT' and Tuesday's is 'DOG' following a hidden pattern, what determines Wednesday's code?",o:["The specific transformation rule connecting consecutive days must be identified first","Always the next animal alphabetically","Random selection","Cannot be determined ever"],a:0,e:"Advanced pattern puzzles require deriving the specific rule from given examples first"},

/* ===================== RENDER: COUNTDOWN ===================== */
function renderCountdown(){
  const target = new Date('2026-08-22T09:00:00');
  const now = new Date();
  let diff = Math.max(0, target - now);
  const days = Math.floor(diff/86400000);
  const hrs = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  const secs = Math.floor((diff%60000)/1000);
  const el = document.getElementById('countdown');
  el.innerHTML = `
    <div class="flap"><div class="flap-num">${days}</div><div class="flap-lbl">Days</div></div>
    <div class="flap"><div class="flap-num">${String(hrs).padStart(2,'0')}</div><div class="flap-lbl">Hrs</div></div>
    <div class="flap"><div class="flap-num">${String(mins).padStart(2,'0')}</div><div class="flap-lbl">Min</div></div>
    <div class="flap"><div class="flap-num">${String(secs).padStart(2,'0')}</div><div class="flap-lbl">Sec</div></div>
  `;
  document.getElementById('boardfoot').textContent = days > 0
    ? `${days} day${days===1?'':'s'} of runway left — make each one count.`
    : `Today is the day. Good luck.`;
}
setInterval(renderCountdown, 1000);
renderCountdown();

/* ===================== RENDER: ROADMAP ===================== */
let doneDays = {};
async function loadRoadmapState(){
  try{
    const r = await window.storage.get('tcs-roadmap-done', false);
    doneDays = r ? JSON.parse(r.value) : {};
  }catch(e){ doneDays = {}; }
  renderRoadmap();
}
async function toggleDay(key){
  doneDays[key] = !doneDays[key];
  renderRoadmap();
  try{ await window.storage.set('tcs-roadmap-done', JSON.stringify(doneDays), false); }catch(e){}
}
function renderRoadmap(){
  const list = document.getElementById('roadmapList');
  let html = '';
  let total = 0, done = 0;
  ROADMAP.forEach(week=>{
    html += `<div class="week-lbl">${week.week}</div>`;
    week.days.forEach(day=>{
      total++;
      const key = day.d;
      const isDone = !!doneDays[key];
      if(isDone) done++;
      html += `
        <div class="day-card ${isDone?'done':''}" onclick="toggleDay('${key}')">
          <div class="day-check">${isDone?'✓':''}</div>
          <div class="day-body">
            <div class="day-head">
              <div class="day-title">${day.d}: ${day.t}</div>
              <div class="day-date">${day.date}</div>
            </div>
            ${day.topics ? `<div class="day-topics">${day.topics}</div>` : ''}
          </div>
        </div>`;
    });
  });
  list.innerHTML = html;
  document.getElementById('progFill').style.width = (done/total*100)+'%';
  document.getElementById('progTxt').textContent = `${done} / ${total} days complete`;
}

/* ===================== RENDER: PRACTICE ===================== */
let currentSection = "Numerical Ability";
let topicScores = {};
async function loadScores(){
  try{
    const r = await window.storage.get('tcs-topic-scores', false);
    topicScores = r ? JSON.parse(r.value) : {};
  }catch(e){ topicScores = {}; }
}
async function saveScores(){
  try{ await window.storage.set('tcs-topic-scores', JSON.stringify(topicScores), false); }catch(e){}
}

function renderSecPicker(){
  const el = document.getElementById('secPick');
  el.innerHTML = Object.keys(SECTIONS).map(s=>
    `<div class="sec-chip ${s===currentSection?'active':''}" onclick="pickSection('${s.replace(/'/g,"\\'")}')">${s}</div>`
  ).join('');
}
function pickSection(s){
  currentSection = s;
  renderSecPicker();
  renderTopics();
}
function renderTopics(){
  const el = document.getElementById('topicList');
  const topics = SECTIONS[currentSection];
  el.innerHTML = topics.map((t,idx)=>{
    const score = topicScores[t];
    const scoreTxt = score !== undefined ? `Best: ${score}/10` : `10 questions`;
    return `
    <div class="topic-item" id="topic-${idx}">
      <div class="topic-head" onclick="toggleTopic(${idx})">
        <div>
          <div class="topic-name">${t}</div>
          <div class="topic-meta">${scoreTxt}</div>
        </div>
        <div class="topic-arrow">▶</div>
      </div>
      <div class="topic-body" id="topic-body-${idx}"></div>
    </div>`;
  }).join('');
}
function toggleTopic(idx){
  const item = document.getElementById('topic-'+idx);
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.topic-item').forEach(t=>t.classList.remove('open'));
  if(!isOpen){
    item.classList.add('open');
    const topicName = SECTIONS[currentSection][idx];
    renderQuestions(idx, topicName);
  }
}
function renderQuestions(idx, topicName){
  const body = document.getElementById('topic-body-'+idx);
  const questions = Q[topicName] || [];
  let html = '';
  questions.forEach((qu,qi)=>{
    html += `<div class="q-block">
      <div class="q-text"><span class="q-num">Q${qi+1}.</span>${qu.q}</div>
      <div id="opts-${idx}-${qi}">
        ${qu.o.map((opt,oi)=>`<button class="opt" onclick="answer(${idx},${qi},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`).join('')}
      </div>
      <div class="exp" id="exp-${idx}-${qi}">${qu.e}</div>
    </div>`;
  });
  html += `<div class="topic-score" id="score-${idx}"></div>`;
  body.innerHTML = html;
  topicAnswered[idx] = topicAnswered[idx] || {};
}
let topicAnswered = {};
function answer(idx, qi, oi){
  const topicName = SECTIONS[currentSection][idx];
  const qu = Q[topicName][qi];
  if(!topicAnswered[idx]) topicAnswered[idx] = {};
  if(topicAnswered[idx][qi] !== undefined) return;
  topicAnswered[idx][qi] = oi;
  const opts = document.querySelectorAll(`#opts-${idx}-${qi} .opt`);
  opts.forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === qu.a) btn.classList.add('correct');
    else if(bi === oi) btn.classList.add('wrong');
  });
  document.getElementById(`exp-${idx}-${qi}`).classList.add('show');

  const totalAnswered = Object.keys(topicAnswered[idx]).length;
  if(totalAnswered === Q[topicName].length){
    let correct = 0;
    Object.keys(topicAnswered[idx]).forEach(k=>{
      if(topicAnswered[idx][k] === Q[topicName][k].a) correct++;
    });
    const scoreEl = document.getElementById(`score-${idx}`);
    scoreEl.textContent = `Score: ${correct} / ${Q[topicName].length}`;
    scoreEl.classList.add('show');
    if(topicScores[topicName] === undefined || correct > topicScores[topicName]){
      topicScores[topicName] = correct;
      saveScores();
    }
    renderTopics();
    setTimeout(()=>{ document.getElementById('topic-'+idx).classList.add('open'); renderQuestions(idx, topicName);
      // restore answered state visually after re-render
      Object.keys(topicAnswered[idx]).forEach(k=>{
        const oi2 = topicAnswered[idx][k];
        const optsEl = document.querySelectorAll(`#opts-${idx}-${k} .opt`);
        optsEl.forEach((btn,bi)=>{
          btn.disabled = true;
          if(bi === Q[topicName][k].a) btn.classList.add('correct');
          else if(bi === oi2) btn.classList.add('wrong');
        });
        document.getElementById(`exp-${idx}-${k}`).classList.add('show');
      });
      document.getElementById(`score-${idx}`).textContent = `Score: ${correct} / ${Q[topicName].length}`;
      document.getElementById(`score-${idx}`).classList.add('show');
    }, 50);
  }
}

/* ===================== TABS ===================== */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.view).classList.add('active');
  });
});

/* ===================== INIT ===================== */
loadRoadmapState();
loadScores().then(()=>{ renderSecPicker(); renderTopics(); });
</script>
